name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Set Password
        run: |
          net user runneradmin P@ssw0rd!

      - name: Download Playit
        run: |
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "playit.exe"

      - name: Start Playit
        run: |
          Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret ${{ secrets.PLAYIT_SECRET }}" -NoNewWindow
          Start-Sleep -Seconds 30
        timeout-minutes: 360
